<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagens - CampanhasFellas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <!-- Cropper.js: popup para escolher a parte da imagem do personagem -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-personagens">
  <header class="topo" id="topo"></header>

  <main class="tela-personagens">
    <!-- Logo abaixo do menu: os fellas e, à direita, os botões da página -->
    <div class="barra-fellas">
      <nav class="lista-fellas" id="lista-fellas"></nav>
      <div class="botoes-titulo" id="acoes-fella"></div>
    </div>

    <!-- A página do fella escolhido (cada um personaliza a sua), de ponta a ponta -->
    <section class="area-fella" id="area"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/formulario-personagem.js"></script>
  <script src="js/personagens.js"></script>
</body>
</html>
