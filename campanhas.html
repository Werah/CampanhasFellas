<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanhas - CampanhasFellas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Campanhas</h1>
      <button class="primario" id="btn-novo">+ Nova campanha</button>
    </div>
    <div class="filtros" id="filtros">
      <button data-filtro="todas" class="ativo">Todas</button>
      <button data-filtro="ativa">Ativas</button>
      <button data-filtro="inativa">Inativas</button>
    </div>
    <div id="lista" class="grade"></div>
  </main>

  <dialog id="modal">
    <form id="form" method="dialog">
      <h2 id="titulo-modal">Nova campanha</h2>
      <label>Nome*
        <input type="text" name="nome" required>
      </label>
      <div class="duas-colunas">
        <label>Sistema
          <input type="text" name="sistema" placeholder="D&D 5e, Tormenta...">
        </label>
        <label>Status
          <select name="status">
            <option value="ativa">Ativa</option>
            <option value="inativa">Inativa</option>
          </select>
        </label>
      </div>
      <div class="duas-colunas">
        <label>Mestre
          <select name="mestreId" id="sel-mestre"></select>
        </label>
        <label>Cor no calendário
          <input type="color" name="cor" value="#8b5cf6">
        </label>
      </div>
      <div class="campo">Imagem (opcional)
        <div class="campo-imagem" id="campo-imagem">
          <div class="preview-imagem"></div>
          <div class="botoes-imagem">
            <label class="botao pequeno">Escolher imagem
              <input type="file" accept="image/*" hidden>
            </label>
            <button type="button" class="pequeno perigo btn-remover-imagem">Remover</button>
          </div>
        </div>
      </div>
      <div class="campo">Jogadores
        <div class="lista-check" id="lista-jogadores"></div>
      </div>
      <label>Descrição
        <textarea name="descricao"></textarea>
      </label>
      <p class="erro" id="erro"></p>
      <div class="botoes-modal">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/campanhas.js"></script>
</body>
</html>
