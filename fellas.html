<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fellas - CampanhasFellas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Fellas</h1>
      <button class="primario" id="btn-novo">+ Novo fella</button>
    </div>
    <div id="lista" class="grade"></div>
  </main>

  <dialog id="modal">
    <form id="form" method="dialog">
      <h2 id="titulo-modal">Novo fella</h2>
      <label>Nick*
        <input type="text" name="nick" required>
      </label>
      <label>Observações
        <textarea name="observacoes"></textarea>
      </label>
      <p class="erro" id="erro"></p>
      <div class="botoes-modal">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/fellas.js"></script>
</body>
</html>
